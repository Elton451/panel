name: panel

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      front-tier

  frontend:
    image: apps/web/
    ports:
      - "3000:3000"
    networks:
      - front-tier
      - back-tier
    configs:
      - httpd-config
    secrets:
      - server-certificate

  backend:
    image: services/api
    volumes:
      - db-data:/etc/data
    networks:
      - back-tier

  volumes:
    db-data:
      driver: mariadb
      driver-opts:
